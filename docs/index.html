<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Wishlist</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>"
    />
  </head>
  <body>
    <header class="site-header">
      <h1 id="page-title">My Wishlist</h1>
      <button id="unlock-btn" class="ghost" title="Enter your key to add/remove items">
        🔒 Unlock editing
      </button>
    </header>

    <main>
      <!-- Add form (hidden until unlocked) -->
      <form id="add-form" class="add-form" hidden>
        <div class="row">
          <input id="f-name" type="text" placeholder="Item name *" required />
          <input id="f-price" type="number" step="0.01" min="0" placeholder="Price" />
        </div>
        <div class="row">
          <input id="f-url" type="url" placeholder="Link (https://…)" />
          <select id="f-priority">
            <option value="">Priority…</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>
        </div>
        <textarea id="f-notes" rows="2" placeholder="Notes (size, color, etc.)"></textarea>
        <button type="submit" class="primary">＋ Add to wishlist</button>
      </form>

      <p id="status" class="status" role="status"></p>

      <ul id="list" class="list"></ul>
    </main>

    <footer class="site-footer">
      Data lives in Notion · synced live via a Cloudflare Worker
    </footer>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
